# Local development database (PostgreSQL 18).
#   Start: docker compose up -d   Stop: docker compose down   Wipe data: docker compose down -v
name: dine-yerevan

services:
  db:
    image: postgres:18
    container_name: dine-yerevan-db
    environment:
      POSTGRES_USER: dine
      POSTGRES_PASSWORD: dine
      POSTGRES_DB: dine_yerevan
    ports:
      # host:container — your machine's localhost:5432 forwards to Postgres inside the container.
      # Bound to 127.0.0.1 so the database isn't reachable from your network.
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data)
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dine -d dine_yerevan']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
