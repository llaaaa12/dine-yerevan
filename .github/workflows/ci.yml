# Runs on every pull request and every push to main. A PR should only be merged when both jobs pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # A throwaway Postgres for the tests; the defaults in src/config/env.ts already point at it
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dine
          POSTGRES_PASSWORD: dine
          POSTGRES_DB: dine_yerevan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dine -d dine_yerevan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
